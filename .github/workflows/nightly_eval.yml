name: Tests And Nightly Eval

on:
  pull_request:
  push:
    branches: [main, milestone-1-real-rag-eval]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare sample data
        run: |
          python scripts/generate_sample_pptx.py -o data/raw/sample_deck.pptx
          pptcopilot ingest data/raw/sample_deck.pptx -o data/processed/sample.jsonl

      - name: Run tests
        run: python -m pytest -q -m "not rag"

  nightly-smoke-eval:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare sample data
        run: |
          python scripts/generate_sample_pptx.py -o data/raw/sample_deck.pptx
          pptcopilot ingest data/raw/sample_deck.pptx -o data/processed/sample.jsonl

      - name: Run smoke eval
        run: |
          pptcopilot eval run --suite smoke --model mock --outdir reports/eval

      - name: Upload eval reports
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-reports
          path: |
            reports/eval/latest_report.json
            reports/eval/latest_report.md


  real-rag:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-rag-v1

      - name: Install real RAG dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,rag]"

      - name: Run real dense RAG integration test
        run: python -m pytest -q -m rag

      - name: Run Hash vs Dense held-out benchmark with real LLM
        run: |
          pptcopilot eval rag             --retriever hash             --retriever dense             --generator hf:google/flan-t5-small             -o reports/eval/milestone1_rag.json

      - name: Upload milestone benchmark
        uses: actions/upload-artifact@v4
        with:
          name: milestone1-real-rag-benchmark
          path: reports/eval/milestone1_rag.json
