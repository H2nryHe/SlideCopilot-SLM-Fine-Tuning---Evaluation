{
  "run_name": "example_real_peft",
  "backend": "peft",
  "mode": "qlora",
  "base_model": "TinyLlama/TinyLlama-1.1B-Chat-v1.0",
  "seed": 42,
  "train_steps": 100,
  "learning_rate": 0.0001,
  "train_jsonl": "data/processed/sample.jsonl",
  "eval_suite": "finetune",
  "base_eval_model": "mock",
  "output_root": "reports/finetune",
  "adapter_dir": "artifacts/finetune/example_real_peft_adapter",
  "simulate_improvement": true,
  "lora": {
    "r": 8,
    "alpha": 16,
    "dropout": 0.05,
    "target_modules": ["q_proj", "v_proj"]
  }
}
